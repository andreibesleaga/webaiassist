# SPDX-License-Identifier: Apache-2.0
# On a version tag (v0.1.0 and so on), in two jobs. `build` has read access only: it checks the
# tag, runs `npm run verify:release` (which installs and runs the dependencies' code) and keeps
# the zip, its SHA-256 and the release notes as an artifact. `publish` has write access and runs
# no installed code: it attests where the zip was built (GitHub build provenance) and creates the
# GitHub release with the CHANGELOG section as its text. It does not upload to the Chrome Web
# Store (the store steps are kept outside this repository).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check that the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run verify:release
      - name: Checksum and release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip="webaiassist-${version}.zip"
          sha256sum "$zip" > "$zip.sha256"
          node scripts/release-notes.mjs "$version" > release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            webaiassist-*.zip
            webaiassist-*.zip.sha256
            release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: webaiassist-*.zip
      - name: Create the release and attach the zip
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip="webaiassist-${version}.zip"
          gh release create "$GITHUB_REF_NAME" "$zip" "$zip.sha256" \
            --title "WebAIAssist $version" --notes-file release-notes.md --verify-tag
